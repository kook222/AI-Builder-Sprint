<!doctype html><html lang="ko"><head><meta charset="utf-8"><title>[중요] 국민은행 계정 보안 알림</title></head><body>
<h1>[중요] 고객님의 계좌가 일시 정지되었습니다</h1>
<p>고객님의 계좌에서 비정상적인 거래가 감지되어 계좌가 일시 정지되었습니다.</p>
<p>24시간 이내에 본인 인증을 완료하지 않으면 계좌가 영구 해지되며 예치금이 반환되지 않습니다.</p>
<p>지금 즉시 아래 버튼을 눌러 본인 인증을 진행해 주시기 바랍니다.</p>
<p><a href="https://kb-star-verify.example.com/auth">지금 바로 본인 인증하러 가기</a></p>
<p>인증 페이지에서 계좌번호와 카드 비밀번호, 보안카드 번호를 입력하시면 즉시 정상화됩니다.</p>
<p>전용 보안 프로그램을 설치하시면 더욱 안전합니다. <a href="https://kb-star-verify.example.com/secure.exe">보안 프로그램 다운로드</a></p>
<script>
// 진짜 피싱 페이지가 쓰는 자동 이동 코드다. 데모라서 실행만 막아뒀다.
// (분석기는 HTML 원문을 읽으므로 이 상태로도 "외부로 튕긴다"는 증거로 잡힌다)
if (false) { setTimeout(function(){ window.location.href = "https://kb-star-verify.example.com/auth"; }, 3000); }
</script>
<script>const __FT_FAKE__ = {
  labels: ['phishing'], reason: '', summary: '국민은행을 사칭해 계좌·카드 정보를 요구하는 피싱 페이지입니다.',
  spans: [
    { text: '고객님의 계좌에서 비정상적인 거래가 감지되어 계좌가 일시 정지되었습니다.', kind: 'phishing', reason: '계정 정지 위협' },
    { text: '24시간 이내에 본인 인증을 완료하지 않으면 계좌가 영구 해지되며 예치금이 반환되지 않습니다.', kind: 'phishing', reason: '시간 압박' },
    { text: '지금 즉시 아래 버튼을 눌러 본인 인증을 진행해 주시기 바랍니다.', kind: 'phishing', reason: '즉시 클릭 재촉' },
    { text: '지금 바로 본인 인증하러 가기', kind: 'phishing', reason: '외부 사이트 유도 링크' },
    { text: '인증 페이지에서 계좌번호와 카드 비밀번호, 보안카드 번호를 입력하시면 즉시 정상화됩니다.', kind: 'phishing', reason: '금융정보 요구' },
    { text: '전용 보안 프로그램을 설치하시면 더욱 안전합니다. 보안 프로그램 다운로드', kind: 'phishing', reason: '출처불명 파일 설치' },
  ]};</script>
<link rel="stylesheet" href="../extension/content/style.css">
<script>
// 확장 없이도 하이라이트를 눈으로 볼 수 있게, solar-pro3가 실제로 돌려준 응답을 그대로 박아둔다.
// (스크립트 안의 글자는 본문 추출 때 걷어내지므로 판정 시험에는 영향이 없다)
window.chrome = {
  storage: { local: { get: (k, cb) => cb({ enabled: true }) } },
  runtime: { sendMessage: async (m) => m.type === 'ANALYZE_PAGE' ? __FT_FAKE__ : null },
};
</script>
<script src="../extension/content/page.js"></script>

</body></html>
